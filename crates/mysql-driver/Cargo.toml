[package]
name = "mysql-driver"
version = "0.1.0"
description = "MySQL and MariaDB implementation of ora-core's DbClient (used by the kilat-ext-mysql extension)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ora-core = { path = "../ora-core" }
mysql = { version = "28", default-features = false, features = ["default-rust", "native-tls"] }
# Link OpenSSL into the downloadable extension on every platform.
native-tls = { version = "=0.2.18", features = ["vendored"] }

[dev-dependencies]
sqlite-driver = { path = "../sqlite-driver" }
