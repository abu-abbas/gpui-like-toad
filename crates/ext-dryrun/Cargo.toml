[package]
name = "kilat-ext-dryrun"
version = "1.0.1"
description = "The Dry-run extension of Kilat: runs an UPDATE or DELETE in a transaction that is never committed, shows old and new values and writes an undo script"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "kilat-ext-dryrun"
path = "src/main.rs"

[dependencies]
ora-core = { path = "../ora-core" }
ora-driver = { path = "../ora-driver" }
serde_json = "1"
