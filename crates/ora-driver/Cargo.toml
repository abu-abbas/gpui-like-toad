[package]
name = "ora-driver"
version = "0.1.0"
description = "Thin Oracle driver implementation of ora-core's DbClient (official rust-oracledb, no Oracle Client install)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ora-core = { path = "../ora-core" }
# Vendored copy of oracle/rust-oracledb at rev b1adfff (every `oracledb`
# version on crates.io is yanked as of 2026-11-16), patched to log in to
# accounts that only have a 10G password verifier. See
# vendor/oracledb/PATCHES.md.
oracledb = { path = "../../vendor/oracledb" }
