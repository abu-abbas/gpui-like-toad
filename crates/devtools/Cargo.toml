[package]
name = "devtools"
version = "0.1.0"
description = "Developer Tools backends for Kilat: a Redis client and a MailHog API client (GPUI-free)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Sync client only (no tokio). TLS through rustls with the OS root store.
redis = { version = "1.8", default-features = false, features = ["tls-rustls"] }
# Both ring and aws-lc-rs end up in the build (ureq, redis), so rustls cannot
# pick a provider by itself: we install ring before the first TLS connect.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# MailHog HTTP API. Same major as the app's own ureq.
ureq = "3"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
