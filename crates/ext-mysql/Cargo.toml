[package]
name = "kilat-ext-mysql"
version = "1.0.0"
description = "The MySQL extension of Kilat: mysql-driver as a separate program that speaks the extension protocol"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "kilat-ext-mysql"
path = "src/main.rs"

[dependencies]
ora-core = { path = "../ora-core" }
mysql-driver = { path = "../mysql-driver" }
