[package]
name = "kilat-ext-redis"
version = "1.0.1"
description = "The Redis extension of Kilat: a key browser and console as a separate program that speaks the extension protocol"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "kilat-ext-redis"
path = "src/main.rs"

[dependencies]
ora-core = { path = "../ora-core" }
devtools = { path = "../devtools" }
serde_json = "1"
