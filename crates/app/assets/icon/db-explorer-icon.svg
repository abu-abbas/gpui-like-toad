    <stop offset="0" stop-color="#32138F"/>
    <stop offset=".42" stop-color="#1D0D6F"/>
    <stop offset="1" stop-color="#2B1394"/>
  </linearGradient>
  <radialGradient id="upper-left-glow" cx="0" cy="0" r=".46">
    <stop offset="0" stop-color="#A465FF" stop-opacity=".28"/>
    <stop offset="1" stop-color="#A465FF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="upper-glow" cx=".80" cy=".02" r=".73" fx=".82" fy="0">
    <stop offset="0" stop-color="#972BFF" stop-opacity="1"/>
    <stop offset=".48" stop-color="#7D23F4" stop-opacity=".65"/>
