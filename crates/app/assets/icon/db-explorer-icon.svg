<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="title description">
<title id="title">DB Explorer — Rust-inspired Database Gear</title>
<desc id="description">Faithful vector recreation of the selected icon: white cogwheel holding a three-tier database on a deep violet-to-indigo rounded square.</desc>
<defs>
