    <stop offset="1" stop-color="#180B66"/>
  </radialGradient>
  <linearGradient id="symbol" x1=".25" y1="0" x2=".77" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".60" stop-color="#FBFAFF"/>
    <stop offset="1" stop-color="#F6F3FF"/>
  </linearGradient>
  <clipPath id="background-clip"><rect width="1000" height="1000" rx="285"/></clipPath>
</defs>
