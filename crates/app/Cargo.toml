[package]
name = "gpui-like-toad"
version = "0.1.0"
description = "Kilat: lightweight database workbench built with Rust and gpui-kit"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ora-core = { path = "../ora-core" }
ora-driver = { path = "../ora-driver" }
sqlite-driver = { path = "../sqlite-driver" }
# `syntect` enables SQL syntax highlighting in the editor with a small
# footprint (no Tree-sitter grammars bundled).
gpui-kit = { version = "0.9.1", features = ["syntect"] }
# GPUI assets must travel with standalone apps, including debug previews.
rust-embed = { version = "8", features = ["debug-embed"] }
# Types of the editor's completion hook (`CompletionProvider`), which
# gpui-kit does not re-export. Versions follow gpui-kit's own.
lsp-types = "0.97"
anyhow = "1"
chrono = "0.4"
# Update check: one anonymous GET to the GitHub Releases API (rustls, no
# OpenSSL needed at build time).
ureq = { version = "3", features = ["platform-verifier"] }
# In-app update (download, verify, swap in, relaunch). The GPUI-free core:
# it only needs Rust 1.85, so the workspace toolchain floor stays.
gpui-updater-core = "0.4"
# Saved connection passwords live in the OS credential store: macOS
# Keychain, Windows Credential Manager, Secret Service on Linux (pure-Rust
# D-Bus via zbus, so no libdbus needed at build time).
keyring = "4.2"
rodio = { version = "0.20.1", default-features = false, features = ["wav"] }

# Linux: decode the PNG used as the X11 window icon. Same major as gpui's
# own `image`, so no second copy is built.
[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Migrate the old bundle name without replacing an existing Kilat.app.
rustix = { version = "1", features = ["fs"] }

# Windows: build.rs embeds assets/icon/AppIcon.ico as the .exe icon
# (Explorer, shortcuts, taskbar, title bar). Uses the MSVC rc.exe found by
# the Windows SDK, so nothing extra to install on windows-latest.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Parses the bundled theme files in a unit test with gpui-kit's own schema.
serde_json = "1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = "3"
