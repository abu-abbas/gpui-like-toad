[package]
name = "gpui-like-toad"
version = "0.1.0"
description = "Ora The Explorer: Toad-like Oracle desktop workbench in Rust + gpui-kit"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ora-core = { path = "../ora-core" }
ora-driver = { path = "../ora-driver" }
# `syntect` enables SQL syntax highlighting in the editor with a small
# footprint (no Tree-sitter grammars bundled).
gpui-kit = { version = "0.9.1", features = ["syntect"] }
