[package]
name = "ora-core"
version = "0.1.0"
description = "Headless Oracle workbench core: client trait, result model, demo backend, CSV export, SQL helpers"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = "0.5"
base64 = "0.22"
blake2 = "0.10"
chacha20poly1305 = "0.10"
# XLSX export and `secrecy` only; everything else stays dependency-free so
# it remains fast to check and test on any machine, including CI and
# low-memory VMs.
rust_xlsxwriter = "0.103"
# Saved passwords travel as `SecretString`: redacted `Debug`, zeroed on
# drop. Tiny (only depends on `zeroize`).
secrecy = "0.10"
# Typed JSON and URL validation for declarative extension UI.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
