[package]
name = "ora-core"
version = "0.1.0"
description = "Headless Oracle workbench core: client trait, result model, demo backend, CSV export, SQL helpers"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# XLSX export only; everything else in this crate stays dependency-free so
# it remains fast to check and test on any machine, including CI and
# low-memory VMs.
rust_xlsxwriter = "0.90"