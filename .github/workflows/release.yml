# Build biner rilis dari main lalu terbitkan sebagai GitHub Release di repo
# ini sendiri (repo sudah publik, jadi tidak perlu repo cermin seperti
# Sistem Akademis). Versi: 0.1.<run_number>. Rilis lama dipangkas
# (sisakan 5 terakhir). Biner belum ditandatangani (code signing menyusul);
# Windows SmartScreen akan menampilkan peringatan saat pertama kali
# menjalankan .exe-nya.
name: Release

on:
  push:
    branches: [main]
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/release.yml']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  KEEP_RELEASES: 5
  VERSION: 0.1.${{ github.run_number }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
            ext: ""
          - os: windows-latest
            suffix: windows-x86_64
            ext: ".exe"
          - os: macos-latest
            suffix: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: runner.os == 'Linux'
        name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev vulkan-validationlayers libvulkan1 pkg-config
      - name: Toolchain Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Pulihkan cache Cargo
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Sematkan nomor versi
        shell: python
        run: |
          import pathlib
          p = pathlib.Path("crates/app/Cargo.toml")
          s = p.read_text()
          updated = s.replace('version = "0.1.0"', 'version = "${{ env.VERSION }}"', 1)
          assert updated != s, "version line not found"
          p.write_text(updated)
          print([line for line in updated.splitlines() if line.startswith("version")])
      - name: Build biner rilis
        run: cargo build --locked --release -p gpui-like-toad
      - name: Smoke test --version dan siapkan artifact
        shell: bash
        run: |
          bin="target/release/gpui-like-toad${{ matrix.ext }}"
          out="gpui-like-toad-$VERSION-${{ matrix.suffix }}${{ matrix.ext }}"
          "$bin" --version
          test "$("$bin" --version)" = "gpui-like-toad $VERSION"
          mkdir -p out
          cp "$bin" "out/$out"
          ls -la out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.suffix }}
          path: out/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          path: out
          merge-multiple: true
      - name: Terbitkan rilis dan pangkas rilis lama
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out/
          test "$(ls out/* | wc -l)" -eq 3
          notes=$(git log -n 15 --no-merges --pretty='- %s' -- crates | head -15)
          gh release create "v$VERSION" out/* \
            --title "gpui-like-toad $VERSION" \
            --notes "Dibangun dari ${{ github.sha }}"$'\n\n'"$notes" --latest
          # Pangkas: sisakan KEEP_RELEASES terbaru, hapus sisanya beserta tag.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | tail -n +$((KEEP_RELEASES + 1)) \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
