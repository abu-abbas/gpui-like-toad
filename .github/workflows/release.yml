# Build biner rilis lalu terbitkan sebagai GitHub Release di repo ini
# sendiri (repo sudah publik, jadi tidak perlu repo cermin seperti
# Sistem Akademis). Tidak lagi jalan otomatis di setiap merge ke main:
# rilis hanya dibuat saat push tag `v*` (versi = nama tag tanpa `v`, mis.
# v0.2.0 -> 0.2.0) atau manual lewat Run workflow (versi dari input, kalau
# kosong 0.1.<run_number>). Rilis lama dipangkas
# (sisakan 5 terakhir). Biner belum ditandatangani (code signing menyusul);
# Windows SmartScreen akan menampilkan peringatan saat pertama kali
# menjalankan .exe-nya, dan macOS Gatekeeper akan memblokir .app/.dmg
# sampai dibuka sekali lewat klik-kanan -> Open. macOS juga menerbitkan
# .dmg berisi .app + symlink Applications (tinggal drag-and-drop). Bundel
# .app diberi tanda tangan ad-hoc. Setiap rilis juga membawa SHA256SUMS dan
# (kalau secret MINISIGN_SECRET_KEY diisi) file .minisig per aset, untuk
# verifikasi update otomatis; lihat docs/release-signing.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi rilis, mis. 0.2.0 (kosongkan untuk 0.1.<run_number>)'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  KEEP_RELEASES: 5
  # Tag -> nama tag; manual -> input, atau 0.1.<run_number> kalau kosong.
  # Awalan `v` dibuang di setiap step (v0.2.0 -> 0.2.0).
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || format('0.1.{0}', github.run_number) }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
            ext: ""
          - os: windows-latest
            suffix: windows-x86_64
            ext: ".exe"
          - os: macos-latest
            suffix: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: runner.os == 'Linux'
        name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev vulkan-validationlayers libvulkan1 pkg-config
      - name: Toolchain Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Pulihkan cache Cargo
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Sematkan nomor versi
        shell: python
        run: |
          import os, pathlib, re
          version = os.environ["VERSION"].removeprefix("v")
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), f"versi harus X.Y.Z, dapat {version!r}"
          p = pathlib.Path("crates/app/Cargo.toml")
          s = p.read_text()
          updated = s.replace('version = "0.1.0"', f'version = "{version}"', 1)
          assert updated != s, "version line not found in Cargo.toml"
          p.write_text(updated)
          # Cargo.lock ikut dibump: kalau tidak, `cargo build --locked` gagal
          # karena lockfile dianggap basi (penyebab gagalnya rilis di main).
          lock = pathlib.Path("Cargo.lock")
          lines = lock.read_text().splitlines(keepends=True)
          out, in_pkg, done = [], False, False
          for line in lines:
              if line.startswith("[[package]]"):
                  in_pkg = False
              if line.strip() == 'name = "gpui-like-toad"':
                  in_pkg = True
              if in_pkg and not done and line.startswith("version = "):
                  line = f'version = "{version}"\n'
                  done = True
              out.append(line)
          assert done, "gpui-like-toad entry not found in Cargo.lock"
          lock.write_text("".join(out))
          print([line for line in updated.splitlines() if line.startswith("version")])
      - name: Build biner rilis
        run: cargo build --locked --release -p gpui-like-toad
      - name: Smoke test --version dan siapkan artifact
        shell: bash
        run: |
          VERSION="${VERSION#v}"
          bin="target/release/gpui-like-toad${{ matrix.ext }}"
          out="Ora-The-Explorer-$VERSION-${{ matrix.suffix }}${{ matrix.ext }}"
          "$bin" --version
          test "$("$bin" --version)" = "Ora The Explorer $VERSION"
          mkdir -p out
          cp "$bin" "out/$out"
          # Linux: the in-app updater installs from a .tar.gz holding the
          # executable (the bare binary above stays for manual download).
          if [ "${{ runner.os }}" = "Linux" ]; then
            tar -czf "out/$out.tar.gz" -C target/release gpui-like-toad
          fi
          ls -la out/
      - if: runner.os == 'macOS'
        name: Bundel .app dan DMG
        shell: bash
        run: |
          VERSION="${VERSION#v}"
          app="bundle/Ora The Explorer.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/release/gpui-like-toad" "$app/Contents/MacOS/gpui-like-toad"
          iconutil -c icns -o "$app/Contents/Resources/AppIcon.icns" \
            crates/app/assets/icon/AppIcon.iconset
          # Nama tampilan "Ora The Explorer"; CFBundleIdentifier dan nama
          # executable sengaja tetap gpui-like-toad supaya izin Keychain dan
          # preferensi macOS dari build lama tidak hilang.
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Ora The Explorer</string>
            <key>CFBundleDisplayName</key>
            <string>Ora The Explorer</string>
            <key>CFBundleIdentifier</key>
            <string>com.github.abu-abbas.gpui-like-toad</string>
            <key>CFBundleVersion</key>
            <string>$VERSION</string>
            <key>CFBundleShortVersionString</key>
            <string>$VERSION</string>
            <key>CFBundleExecutable</key>
            <string>gpui-like-toad</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          # Tanda tangan ad-hoc (gratis, tanpa akun Apple Developer): segel
          # bundel jadi konsisten dan arm64 tidak menolaknya karena segel
          # rusak. Ini BUKAN notarization, jadi Gatekeeper tetap menegur
          # instalasi pertama dari browser (klik kanan -> Open sekali).
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Smoke test biner di dalam bundel (bukan cuma biner mentahnya).
          "$app/Contents/MacOS/gpui-like-toad" --version
          test "$("$app/Contents/MacOS/gpui-like-toad" --version)" = "Ora The Explorer $VERSION"
          # DMG: .app + symlink ke /Applications (drag-and-drop).
          mkdir -p dmg-staging
          cp -R "$app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Ora The Explorer $VERSION" \
            -srcfolder dmg-staging -ov -format UDZO \
            "out/Ora-The-Explorer-$VERSION-macos-arm64.dmg"
          ls -la out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.suffix }}
          path: out/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          path: out
          merge-multiple: true
      - name: Checksum dan tanda tangan minisign
        env:
          # Kunci rahasia minisign TANPA password (minisign -G -W); isi file
          # .key-nya disimpan sebagai secret repo. Kalau belum diisi, langkah
          # tanda tangan dilewati (checksum tetap dibuat) supaya rilis tetap
          # jalan. Kunci publiknya di-commit sebagai release-key.pub.
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          ls -la out/
          test "$(ls out/* | wc -l)" -eq 5
          cd out
          sha256sum Ora-The-Explorer-* > SHA256SUMS
          cat SHA256SUMS
          if [ -n "$MINISIGN_SECRET_KEY" ]; then
            sudo apt-get install -y minisign
            printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/release.key"
            # Kunci publik diturunkan dari kunci rahasia, lalu dipakai
            # memverifikasi tiap tanda tangan. Kalau release-key.pub di repo
            # berbeda, beri peringatan: app akan menolak update.
            minisign -R -s "$RUNNER_TEMP/release.key" -p "$RUNNER_TEMP/release.pub"
            if [ -f ../release-key.pub ] && ! diff -q <(tail -n 1 ../release-key.pub) <(tail -n 1 "$RUNNER_TEMP/release.pub") >/dev/null; then
              echo "::warning::release-key.pub di repo tidak cocok dengan MINISIGN_SECRET_KEY."
            fi
            for f in Ora-The-Explorer-* SHA256SUMS; do
              # Trusted comment `version:X.Y.Z` binds the signature to this
              # release, so an older signed file cannot pass as a newer one.
              minisign -S -s "$RUNNER_TEMP/release.key" -t "version:${VERSION#v}" -m "$f"
              minisign -V -p "$RUNNER_TEMP/release.pub" -m "$f"
            done
            rm -f "$RUNNER_TEMP/release.key"
          else
            echo "::warning::MINISIGN_SECRET_KEY belum diisi; rilis tanpa tanda tangan minisign."
          fi
          ls -la
      - name: Terbitkan rilis dan pangkas rilis lama
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(git log -n 15 --no-merges --pretty='- %s' -- crates | head -15)
          VERSION="${VERSION#v}"
          gh release create "v$VERSION" out/* --target "${{ github.sha }}" \
            --title "Ora The Explorer $VERSION" \
            --notes "Dibangun dari ${{ github.sha }}"$'\n\n'"$notes" --latest
          # Pangkas: sisakan KEEP_RELEASES terbaru, hapus sisanya beserta tag.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | tail -n +$((KEEP_RELEASES + 1)) \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
