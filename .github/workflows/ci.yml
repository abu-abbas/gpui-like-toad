# Validasi PR sebelum merge. Job `ci-ok` adalah required check untuk `main`.
# Paket distribusi dibangun oleh workflow Release saat tag atau run manual.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: diff
        name: Deteksi perubahan kode Rust
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$PR_BASE" ] || ! git cat-file -e "$PR_BASE^{commit}" 2>/dev/null; then
            files=$(git ls-files)
          else
            files=$(git diff --name-only --no-renames "$PR_BASE" HEAD)
          fi
          echo "$files"
          if echo "$files" | grep -qE '^(crates/|\.cargo/|\.github/(workflows|actions)/|Cargo\.(toml|lock)$|rust-toolchain(\.toml)?$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  # Judul PR jadi pesan commit di main (squash merge) → wajib Conventional Commits untuk versioning otomatis.
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Judul PR mengikuti Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\((app|core|driver|ci|docs|deps)\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "::error::Judul PR \"$TITLE\" harus format Conventional Commits, mis. 'feat(app): editor' atau 'ci: cek judul PR'"
            exit 1
          fi

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: rust
        name: Toolchain Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      # Cache PR dapat dipakai lagi saat commit baru didorong ke PR yang sama.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: cargo-ci-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-
      - run: cargo fmt --check
      - run: cargo clippy -p ora-core -p ora-driver -p sqlite-driver -p devtools --all-targets --locked -- -D warnings
      - run: cargo test -p ora-core -p ora-driver -p sqlite-driver -p devtools --locked

  # Kompilasi GUI pertama dan satu-satunya yang terpercaya: VM dev tidak
  # cukup RAM untuk gpui-kit. Job ini juga menjalankan unit test app crate.
  # Clippy di sini tanpa -D warnings: kode GUI belum pernah dikompilasi di
  # luar CI, jadi warning gaya tidak boleh memblokir sinyal kompilasi.
  gui:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile macOS launcher icon
        if: runner.os == 'macOS'
        run: sh crates/app/assets/icon/compile-macos-icon.sh "$RUNNER_TEMP/kilat-icons"
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev vulkan-validationlayers libvulkan1 pkg-config
      - id: rust
        name: Toolchain Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: cargo-ci-gui-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-gui-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  # Security test statis: ruleset Semgrep registry. Temuan apa pun membuat
  # CI merah; false positive diberi komentar `nosemgrep: <id>` beserta alasannya.
  security:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.182.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep
        run: >-
          semgrep scan --error --metrics=off
          --config p/rust --config p/secrets --config p/github-actions

  audit:
    uses: ./.github/workflows/audit.yml

  ci-ok:
    if: always()
    needs: [changes, pr-title, test, gui, security, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Verifikasi hasil check yang diwajibkan
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          jq -e '
            .changes.result == "success" and
            .["pr-title"].result == "success" and
            .security.result == "success" and
            .audit.result == "success" and
            (if .changes.outputs.rust == "true" then
              .test.result == "success" and .gui.result == "success"
            else
              .changes.outputs.rust == "false" and
              .test.result == "skipped" and .gui.result == "skipped"
            end)
          ' <<< "$RESULTS"
