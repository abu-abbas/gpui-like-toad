# Audit dependency terhadap RustSec. Dipanggil dari CI (setiap PR) dan Release
# (sebelum build), plus jadwal harian karena advisory baru muncul tanpa
# perubahan kode. Gagal untuk vulnerability, crate unsound, dan crate yanked;
# "unmaintained" hanya peringatan (lihat .cargo/audit.toml).
name: Audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: tool
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.23.0-${{ runner.os }}
      - name: Pasang cargo-audit
        if: steps.tool.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: cargo audit
        run: cargo audit --deny unsound --deny yanked
