[package]
name = "native-tls"
version = "0.2.18"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-native-tls/rust-native-tls"
publish = false

[features]
default = []
vendored = ["openssl/vendored"]
alpn = []
alpn-accept = []

[dependencies]
log = "0.4.27"
openssl = "0.10.75"
openssl-probe = "0.2.1"
openssl-sys = "0.9.111"

[dev-dependencies]
tempfile = "3.0"
test-cert-gen = "0.9"
